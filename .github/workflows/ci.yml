name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: 8.30.1
  # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's checksums file.
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
      - name: Scan history for secrets (gitleaks)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          ./gitleaks git --redact --exit-code 1 .

  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      # The only place secrets are read. With none provisioned the job stays green
      # and every later step is skipped; with only some, it fails by name.
      - name: Check that deploy secrets are provisioned
        id: deploy-gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HYPERDRIVE_ID: ${{ secrets.HYPERDRIVE_ID }}
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          STATUS_URL: ${{ secrets.STATUS_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          names="CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID HYPERDRIVE_ID MIGRATION_DATABASE_URL STATUS_URL CF_ACCESS_CLIENT_ID CF_ACCESS_CLIENT_SECRET"
          missing=""
          total=0
          count=0
          for name in $names; do
            total=$((total + 1))
            if [ -z "${!name}" ]; then
              missing="${missing:+$missing, }$name"
              count=$((count + 1))
            fi
          done
          if [ "$count" -eq "$total" ]; then
            echo "::notice::deploy skipped: secrets not provisioned: $missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ "$count" -gt 0 ]; then
            echo "::error::deploy misconfigured: missing $missing"
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      # The public site origin is derived from STATUS_URL (no extra secret), so a
      # wrong shape must fail before migrations, naming the variable and never its value.
      - name: Check the status URL shape
        id: status-url-shape
        if: steps.deploy-gate.outputs.ready == 'true'
        env:
          STATUS_URL: ${{ secrets.STATUS_URL }}
        run: |
          case "$STATUS_URL" in
            */status) ;;
            *)
              echo "::error::deploy misconfigured: STATUS_URL must end in /status"
              exit 1
              ;;
          esac
      - if: steps.deploy-gate.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.deploy-gate.outputs.ready == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.deploy-gate.outputs.ready == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.deploy-gate.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      # The real Hyperdrive id exists only in this workspace and is never committed.
      - name: Substitute the Hyperdrive id
        if: steps.deploy-gate.outputs.ready == 'true'
        env:
          HYPERDRIVE_ID: ${{ secrets.HYPERDRIVE_ID }}
        run: |
          sed -i "s/00000000000000000000000000000000/${HYPERDRIVE_ID}/" wrangler.jsonc
          grep -qF -- "${HYPERDRIVE_ID}" wrangler.jsonc
      - if: steps.deploy-gate.outputs.ready == 'true'
        run: pnpm build
      - name: Apply database migrations
        if: steps.deploy-gate.outputs.ready == 'true'
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: pnpm db:migrate
      - name: Deploy the Worker
        if: steps.deploy-gate.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STATUS_URL: ${{ secrets.STATUS_URL }}
        # GitHub masks the full STATUS_URL secret, but the derived workers.dev
        # origin is a substring and is NOT masked: it shows in wrangler's output.
        # It is public once deployed, so it is not a secret.
        run: pnpm exec wrangler deploy --var BUILD_COMMIT:${{ github.sha }} --var "SITE_URL:${STATUS_URL%/status}"
      - name: Smoke check the deployed status page through Access
        if: steps.deploy-gate.outputs.ready == 'true'
        env:
          STATUS_URL: ${{ secrets.STATUS_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          body=$(curl -fsS --retry 3 --retry-delay 5 --retry-all-errors \
            -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" \
            -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}" \
            "$STATUS_URL")
          grep -q 'data-status="ok"' <<< "$body"
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" \
            -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}" \
            "${STATUS_URL%/status}/admin")
          if [ "$code" != "403" ]; then
            echo "::error::smoke: /admin must deny the CI service token"
            exit 1
          fi
